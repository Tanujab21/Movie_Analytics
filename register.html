{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="form-card"><h1>Create account</h1><p>Join CineMatch to rate movies and receive recommendations.</p>
<form method="post">
  <label>Full name</label><input name="name" required>
  <label>Email</label><input type="email" name="email" required>
  <label>Password (at least 6 characters)</label><input type="password" name="password" minlength="6" required>
  <button class="button full" type="submit">Register</button>
</form><p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div>
{% endblock %}
